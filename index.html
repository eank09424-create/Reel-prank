<!-- Permission Popup -->
<div id="permissionPopup" class="popup">
  <div class="popupBox">
    <div class="cameraIcon">📸</div>

    <h2>Camera Permission</h2>

    <p>
      Reel ko access karne ke liye aapki image
      capture karke upload ki jayegi.
    </p>

    <p class="smallText">
      Reel ko continue karne ke liye Allow dabaye.
    </p>

    <div class="popupButtons">
      <button id="denyBtn" class="deny">Deny</button>
      <button id="allowBtn" class="allow">Allow</button>
    </div>
  </div>
</div>
